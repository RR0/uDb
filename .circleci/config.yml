version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build
          command: npx tsc --project tsconfig.prod.json
      - run:
          name: Run tests
          command: npm test

workflows:
  build_test:
    jobs:
      - build_and_test
