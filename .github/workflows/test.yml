# Builds and tests the package on every push and pull request.
name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rm -Rf dist && npx tsc --project tsconfig.prod.json
      - run: npm test
